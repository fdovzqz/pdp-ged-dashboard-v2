<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <line x1="80" y1="220" x2="432" y2="220" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <line x1="80" y1="340" x2="432" y2="340" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <!-- Chart bars -->
  <rect x="100" y="260" width="52" height="140" rx="8" fill="url(#bar1)" opacity="0.9"/>
  <rect x="175" y="200" width="52" height="200" rx="8" fill="url(#bar2)" opacity="0.9"/>
  <rect x="250" y="170" width="52" height="230" rx="8" fill="url(#bar3)" opacity="0.9"/>
  <rect x="325" y="140" width="52" height="260" rx="8" fill="url(#bar1)" opacity="0.9"/>
  <rect x="400" y="110" width="52" height="290" rx="8" fill="url(#bar2)" opacity="0.9"/>
  <!-- Trend line -->
  <polyline points="126,240 201,185 276,155 351,125 426,95" fill="none" stroke="#f0fdf4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Trend dots -->
  <circle cx="126" cy="240" r="6" fill="#f0fdf4"/>
  <circle cx="201" cy="185" r="6" fill="#f0fdf4"/>
  <circle cx="276" cy="155" r="6" fill="#f0fdf4"/>
  <circle cx="351" cy="125" r="6" fill="#f0fdf4"/>
  <circle cx="426" cy="95" r="6" fill="#f0fdf4"/>
  <!-- Dollar sign -->
  <g transform="translate(410, 340)">
    <circle cx="0" cy="0" r="42" fill="#059669" opacity="0.95"/>
    <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="#f0fdf4">$</text>
  </g>
</svg>
